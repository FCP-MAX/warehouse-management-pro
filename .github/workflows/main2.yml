name: Build Android APP

# 触发条件：推送代码到main分支、手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置JDK（Android编译依赖JDK 17）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 授予gradlew执行权限（避免权限报错）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 编译APK（重点解决图片资源编译问题）
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace  # --stacktrace能打印图片编译的详细报错

      # 5. 上传编译好的APK（方便下载）
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
