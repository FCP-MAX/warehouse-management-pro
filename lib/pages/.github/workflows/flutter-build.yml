name: Flutter Build APK
on:
  push:
    branches: [ main ] # 推送代码到main分支自动触发编译
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest # 用Ubuntu系统编译，速度最快
    steps:
      - uses: actions/checkout@v4 # 拉取仓库代码
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0' # 稳定版本，适配所有功能
      
      - name: Install dependencies
        run: flutter pub get # 安装项目依赖
      
      - name: Generate localization files
        run: flutter gen-l10n # 生成多语言文件
      
      - name: Build APK
        run: flutter build apk --release # 编译正式版APK
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk # 输出APK文件名
          path: build/app/outputs/flutter-apk/app-release.apk # APK路径
